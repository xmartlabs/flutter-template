name: flutter_template
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: 3.47.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  design_system:
    path: ./design_system

  auto_route: ^11.1.0
  cupertino_icons: ^1.0.9
  dartx: 1.2.0
  dio: ^5.11.1
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_native_splash: ^2.4.8
  flutter_screenutil: 5.9.3
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.2
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  google_fonts: ^8.2.1
  intl: 0.20.3
  json_annotation: ^4.12.0
  logger: ^2.8.0
  material_color_generator: 1.1.0
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  stack_trace: ^1.12.2
  stock: ^1.1.2
  hive: 2.2.3
  path_provider: ^2.1.6
  mutex: 3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  auto_route_generator: ^10.6.0
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  dart_code_linter: ^4.3.0
  flutter_flavorizr: ^2.6.0
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  lints: ^6.1.0
  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: 2.1.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - environments/

flutter_gen:
  assets:
    exclude:
      - environments/*
      - assets/README.md

# Run command: flutter pub run flutter_launcher_icons:main
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icons/ic_launcher.png"
  image_path_ios: "icons/ic_launcher_ios.png" # Transparency not supported on IOS
  adaptive_icon_foreground: "icons/ic_launcher_foreground.png"
  adaptive_icon_background: "#ee1a64"
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false

flutter_native_splash:
  color: "#ffffff"
  image: "icons/splash_logo.png"
  android_12:
    image: "icons/splash_logo_android_12.png"
    branding: "icons/splash_branding.png"
